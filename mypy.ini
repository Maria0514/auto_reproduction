# mypy 静态类型检查配置
#
# 跑法：
#   .venv/bin/mypy                      # 无参数即按下方 files= 检查 core/（CI 用这条）
#   .venv/bin/mypy core/nodes/planning.py   # 单文件
#
# ── 接入基线（2026-07-30 实测）────────────────────────────────────────────────
# mypy 2.3.0 默认配置跑 core/：54 errors / 12 files（checked 27 source files）。
# 本配置**未改动任何生产代码**，而是把这 54 个错误按「文件 + 具体 error code」
# 逐条登记进下方【债务清单】，使仓库当前 100% 通过（零错误退出）。
#
# 54 个错误的处置去向（精确对账，合计 54）：
#   - 52 个 → 下方【债务清单】的 disable_error_code，分布在 11 个文件；
#   -  2 个 → 缺 stub 的 import（deepxiv_sdk / requests），由 ignore_missing_imports
#             处理，属标准做法不算债务。
#
# 关键：受影响的只有 11 个文件。core/ 共 27 个模块，其余 16 个——包含 state.py
# （TypedDict 总枢纽）、errors.py（异常体系）、react_base.py（ReAct 引擎）、
# secrets_store.py、plan_checks.py 及 4/7 的 tools——一条压制都没有，其中 12 个
# 还额外进了 strict 档。也就是说这份配置不是装饰品：这些模块里任何新写的代码、
# 任何类型回归都会被立刻拦住（接入时已用临时探针实测验证过会红）。
#
# ── 逐步收紧路径（ratchet，只准往严了走）──────────────────────────────────────
#   1. 债务清单里每一行 disable_error_code 都是一条「可以删掉的 TODO」。删掉某个
#      code → 跑 mypy → 修掉暴露的错误，即可永久收紧。禁止反向新增 code。
#   2. [strict 档] 的模块名单只增不减；新建模块默认进 strict 档，不准进债务清单。
#   3. 债务清单清空后，把本段 [mypy] 升级为全局 disallow_untyped_defs = True。
#
# ── 54 个错误的根因归类（已逐条人工核对，非估算）────────────────────────────
#   根因 A（36/54）：防御性惯用法 `x = state.get("some_key") or {}`。
#     GlobalState 里字段是 `SomeTypedDict | None`，`or {}` 后 mypy 无法为空 dict
#     推出类型参数 → 报 var-annotated；该变量再传给标注 `dict[str, Any]` 的 helper
#     时，因 TypedDict 不是 Dict[str, Any] 的子类型 → 报 arg-type。不是 bug。
#   根因 B（10/54）：第三方生态类型信息不全/过严——LangGraph 内部 _Node 重载 ×2、
#     ast 模块宽基类 ×3、pydantic 别名字段 ×2、subprocess.Popen 重载 ×1、
#     缺 stub 的 deepxiv_sdk / requests ×2。不是 bug。
#   其余 8/54：7 个是**真实类型缺陷**（下方标注 D-1..D-6，其中 D-6 占 2 个错误），
#     值得单独排期修；1 个是 planning.py L572 `float()` 已被 try/except 兜住的误报。
#     本次接入不许改生产代码，故一律登记未修。

[mypy]
python_version = 3.11
files = core

# 跟随 import 检查被 core/ 依赖的一方代码（config.py / sandbox/），
# 保证债务边界是全量可见的，而不是靠不看来"变绿"。
follow_imports = normal

# 输出可读性：显示 error code，便于把新错误直接归档进债务清单。
show_error_codes = True
show_column_numbers = True
pretty = False

warn_redundant_casts = True
warn_unused_configs = True

# 关掉「无用的 type: ignore」告警：生产代码里已有的 # type: ignore[...] 注释
# 在本配置的宽档下会有一部分变成冗余，但本次接入不允许改生产代码。
# 债务清单清空后应改为 True。
warn_unused_ignores = False


# ══════════════════════════════════════════════════════════════════════════════
# 第三方库：缺 stub / 未标注。标准做法，不算债务，无需 ratchet。
# ══════════════════════════════════════════════════════════════════════════════

# 本地 editable 安装的 SDK，未发布 py.typed。
[mypy-deepxiv_sdk.*]
ignore_missing_imports = True

# requests 的 stub 在 types-requests，不为静态检查引入额外运行时依赖。
[mypy-requests.*]
ignore_missing_imports = True

# LangChain / LangGraph 生态：部分子包未随包发 stub。
[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-langchain_core.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-tiktoken.*]
ignore_missing_imports = True


# ══════════════════════════════════════════════════════════════════════════════
# 【债务清单】11 个文件 / 52 个错误。每节标题括号内数字 = 该文件压制的错误数。
# 每一行 disable_error_code 都只列该文件**实际触发过**的 code，不做无差别关闭，
# 这样同文件里其它类别的新错误依旧会被拦住。
# ══════════════════════════════════════════════════════════════════════════════

# graph.py（4）：
#   - var-annotated ×1  L77  `plan = state.get("reproduction_plan") or {}`（根因 A）
#   - arg-type      ×2  L189/191 add_node 的 _Node[Never] 重载（根因 B，LangGraph 内部类型）
#   - name-defined  ×1  L164 返回标注 "CompiledGraph" 是个不存在的名字（见 TODO：真实缺陷 D-3）
[mypy-core.graph]
disable_error_code = var-annotated, arg-type, name-defined

# honesty_audit.py（4）：ast 模块的宽基类。`ast.AST` 无 lineno、`ast.expr` 无 value，
# 但实际调用点已由结构判断保证具体子类型（根因 B）。
#   - attr-defined ×3  L255/256/303
#   - arg-type     ×1  L441 `expr | None` 传给形参 `AST`（见 TODO：真实缺陷 D-4）
[mypy-core.honesty_audit]
disable_error_code = attr-defined, arg-type

# llm_client.py（3）：全部指向 ChatOpenAI 构造（根因 B）。
#   - assignment ×1  L50  api_key 回退 get_llm_api_key() 返回 str|None（见 TODO：真实缺陷 D-1）
#   - call-arg   ×1  L51  max_tokens 被 pydantic 别名 max_completion_tokens 遮蔽；
#                          已实测 populate_by_name=True，运行时确实生效，属误报
#   - arg-type   ×1  L54  api_key 形参声明 SecretStr，运行时 pydantic 自动强转 str
[mypy-core.llm_client]
disable_error_code = assignment, call-arg, arg-type

# nodes/coding.py（7）：全部根因 A。
#   - var-annotated ×6  L404/410/415/432/549/765
#   - arg-type      ×1  L474 ExecutionResult 传给 dict[str, Any] 形参
[mypy-core.nodes.coding]
disable_error_code = var-annotated, arg-type

# nodes/execution.py（6）：全部根因 A。
#   - call-overload ×1  L520 `(state.get("paper_analysis") or {}).get("metrics")`
#   - var-annotated ×2  L2308/2340
#   - arg-type      ×3  L2310/2346/2354
[mypy-core.nodes.execution]
disable_error_code = call-overload, var-annotated, arg-type

# nodes/paper_analysis.py（1）：
#   - index ×1  L520 `state["paper_meta"]["arxiv_id"]`，paper_meta 声明为 PaperMeta|None
#                （见 TODO：真实缺陷 D-2，潜在 None 下标）
[mypy-core.nodes.paper_analysis]
disable_error_code = index

# nodes/planning.py（14）：
#   - assignment  ×6  L728/729/766/767/777/778 —— 均因 L720 的 out 未标注，被推成
#                      dict[str, Collection[Collection[str]]]（根因 A 的变体）
#   - no-redef    ×1  L749 out 在 L720 已定义，此处重复带标注赋值（见 TODO：真实缺陷 D-5）
#   - arg-type    ×6  L797/798/799/962/1021（根因 A）+ L572 float() 已被 try/except 兜住
#   - attr-defined ×1 L567 payload.get("repos") 在 object 上迭代（根因 A）
[mypy-core.nodes.planning]
disable_error_code = assignment, no-redef, arg-type, attr-defined

# nodes/reporting.py（8）：全部根因 A。
#   - var-annotated  ×5  L354/495/814/930/995
#   - typeddict-item ×1  L581 `{}` 字面量被推成 ExecutionResult，缺 11 个必填键
#   - arg-type       ×2  L1149/1196
[mypy-core.nodes.reporting]
disable_error_code = var-annotated, typeddict-item, arg-type

# nodes/resource_scout.py（2）：根因 A。
#   - arg-type ×2  L754/755
[mypy-core.nodes.resource_scout]
disable_error_code = arg-type

# tools/git_tools.py（2，另有 1 条 requests 缺 stub 已在上面处理）：
#   - assignment   ×1  L283 _classify_clone_failure 声明 `-> Exception`，赋给
#                       `TransientError | None` 变量（见 TODO：真实缺陷 D-6，返回标注过宽）
#   - attr-defined ×1  L286 同因，Exception 上无 .message
[mypy-core.tools.git_tools]
disable_error_code = assignment, attr-defined

# sandbox/local_venv.py（1）：被 core/nodes/execution.py 跟随 import 带入。
#   - call-overload ×1  L392 Popen(env=dict[str, object]) 不匹配任一重载（根因 B）
[mypy-sandbox.local_venv]
disable_error_code = call-overload


# ══════════════════════════════════════════════════════════════════════════════
# 【strict 档】当前 0 错误的模块 —— 在默认档之上再加严。
# 这一档是本配置真正的"拦截力"来源：关键路径 state.py（TypedDict 总枢纽）、
# errors.py（异常体系）、plan_checks.py、secrets_store.py、paper_intake 节点、
# code_fs_tools 都在这里，新写的函数必须带完整签名标注才能过。
# 名单只增不减；新建模块默认加入本档。
# ══════════════════════════════════════════════════════════════════════════════

# 全签名标注强制：函数必须有完整的参数 + 返回类型标注。
[mypy-core,core.nodes,core.tools,core.state,core.errors,core.plan_checks,core.activity_stream,core.checkpointer,core.nodes.paper_intake,core.nodes._repo_scoring,core.tools.code_fs_tools,core.secrets_store]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 额外禁止「声明了具体返回类型、实际却回了 Any」。
# secrets_store 不在此列：L188 `return entry["value"]` 从 dict[str, Any] 取值必然是 Any。
[mypy-core,core.nodes,core.tools,core.state,core.errors,core.plan_checks,core.activity_stream,core.checkpointer,core.nodes.paper_intake,core.nodes._repo_scoring,core.tools.code_fs_tools]
warn_return_any = True

# ── 距离 strict 档只差几个标注的模块（下一步收紧的最优先目标）──────────────────
# 以下 4 个模块目前留在默认档，原因是各自缺极少量返回类型标注（本次接入不许改
# 生产代码，故未补）。补齐后即可并入上面的 strict 档：
#   core/react_base.py           L504 create_react_subgraph、L520 _bind_llm 缺返回标注
#                                （另有 L119/126/143/447 json.loads / model_dump 回 Any，
#                                 故并入后仍不宜开 warn_return_any）
#   core/tools/run_command_tool.py  L60  make_run_command_tool 缺返回标注
#   core/tools/env_probe_tool.py    L177 make_probe_environment_tool 缺返回标注
#   core/tools/interaction_tools.py L110 make_request_user_input_tool 缺返回标注
# 4 个工厂函数的返回类型都是 langchain_core.tools.BaseTool，补起来是一行的事。
