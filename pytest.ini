[pytest]
testpaths = tests
; 默认排除 e2e（防误跑真实链路耗 LLM/deepxiv 配额，2026-07-04 E4 事故机制性防线）。
; 跑 e2e 须显式 `-m e2e` 覆盖（命令行 -m 优先于 addopts），且须 Maria 明确授权。
; 默认同时排除 platform_limit（本机受限令牌环境**物理上观测不到**的用例，见下）。
; 🔴 命令行 -m 会**整体覆盖**本行 ⇒ 收口门/回归命令必须写全：
;     -m "not e2e and not browser and not platform_limit"
;   只写 `-m "not e2e and not browser"` 会把 platform_limit 用例放出来跑（它们在本机必红）。
addopts = -m "not e2e and not platform_limit"
markers =
    e2e: 真实端到端测试，需要 LLM_API_KEY 和 DEEPXIV_TOKEN（凭证缺失自动 skip）。默认被 addopts 排除，显式 `-m e2e` 才跑。
    browser: Playwright 浏览器 e2e（起 streamlit 子进程 + chromium，默认可跑；chromium 起不动则 skip）。
    sandbox_real: sandbox 真实执行 e2e（真建 venv / 真 pip install / 真 subprocess / 真收产物；不需凭证、不耗 deepxiv/LLM 配额，但慢）。这些用例同时打 e2e 标签，随 addopts 默认排除；显式 `-m sandbox_real` 触发真跑。
    platform_limit: **本机环境物理上不可观测**的用例（受限令牌：建不了符号链接 / chmod 不生效 / 起不了某些子进程；外加既有 checkpoint 库的版本语义）。断言一个字没删，只是默认不跑 —— 换到 CI 或提权环境用 `-m platform_limit` 一条命令全部恢复。清单与逐条成因见 `docs/sprint8/platform-red-whitelist.md`。源码位置：`@pytest.mark.platform_limit  # 平台门控：<原因>`。
